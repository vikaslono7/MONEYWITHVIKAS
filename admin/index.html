<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Login — MoneyWithVikas</title>

  <style>
    :root {
      --bg: #07090b;
      --panel: #101419;
      --line: #29313a;
      --text: #f5f5f5;
      --muted: #9aa3ad;
      --yellow: #ffc400;
      --red: #ff2028;
      --green: #2ecc71;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(
          circle at top right,
          rgba(255, 196, 0, 0.08),
          transparent 35%
        ),
        var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .login-page {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 430px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 35px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }

    .logo {
      font-size: 25px;
      font-weight: 900;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }

    .logo span {
      color: var(--yellow);
    }

    .tagline {
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 2px;
      margin-bottom: 35px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .intro {
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 25px;
    }

    label {
      display: block;
      color: #cbd0d6;
      font-size: 13px;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 18px;
      background: #080b0e;
      color: white;
      border: 1px solid var(--line);
      border-radius: 8px;
      outline: none;
    }

    input:focus {
      border-color: var(--yellow);
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: var(--yellow);
      color: #050505;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .login-btn:hover {
      opacity: 0.9;
    }

    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: var(--muted);
      font-size: 13px;
      text-decoration: none;
    }

    .back:hover {
      color: white;
    }

    .notice {
      margin-top: 25px;
      padding: 12px;
      border: 1px solid #493f16;
      background: rgba(255, 196, 0, 0.05);
      color: #aaa;
      border-radius: 8px;
      font-size: 11px;
      line-height: 1.5;
    }

    .login-status {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
    }

    .login-status.error {
      display: block;
      border: 1px solid rgba(255, 32, 40, 0.5);
      background: rgba(255, 32, 40, 0.08);
      color: #ff7b80;
    }

    .login-status.success {
      display: block;
      border: 1px solid rgba(46, 204, 113, 0.5);
      background: rgba(46, 204, 113, 0.08);
      color: #70e39a;
    }

    .login-status.loading {
      display: block;
      border: 1px solid rgba(255, 196, 0, 0.4);
      background: rgba(255, 196, 0, 0.05);
      color: #ffc400;
    }
  </style>
</head>

<body>

  <div class="login-page">

    <form class="login-box" id="adminLogin">

      <div class="logo">
        MONEY<span>WITH</span>VIKAS
      </div>

      <div class="tagline">
        ADMIN CONTROL PANEL
      </div>

      <h1>Admin Login</h1>

      <p class="intro">
        Secure access to your MoneyWithVikas requests,
        bookings and website settings.
      </p>

      <label for="email">
        Email Address
      </label>

      <input
        id="email"
        name="email"
        type="email"
        placeholder="admin@moneywithvikas.com"
        autocomplete="username"
        required
      >

      <label for="password">
        Password
      </label>

      <input
        id="password"
        name="password"
        type="password"
        placeholder="Enter password"
        autocomplete="current-password"
        required
      >

      <button
        class="login-btn"
        id="loginButton"
        type="submit"
      >
        Sign In →
      </button>

      <div
        class="login-status"
        id="loginStatus"
        aria-live="polite"
      ></div>

      <a class="back" href="../index.html">
        ← Back to MoneyWithVikas
      </a>

      <div class="notice">
        Authentication is protected by Supabase Auth and
        administrator access is verified against the
        MoneyWithVikas admin_users table.
      </div>

    </form>

  </div>


  <!-- ==========================================
       SUPABASE
       ========================================== -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="../js/supabase.js"></script>


  <!-- ==========================================
       ADMIN LOGIN
       ========================================== -->

  <script>

    document.addEventListener("DOMContentLoaded", async () => {

      const loginForm =
        document.getElementById("adminLogin");

      const emailInput =
        document.getElementById("email");

      const passwordInput =
        document.getElementById("password");

      const loginButton =
        document.getElementById("loginButton");

      const loginStatus =
        document.getElementById("loginStatus");


      // ==========================================
      // CHECK SUPABASE
      // ==========================================

      if (!window.mwvSupabase) {

        showStatus(
          "error",
          "Authentication service is unavailable. Please try again later."
        );

        return;
      }


      // ==========================================
      // CHECK EXISTING SESSION
      // ==========================================

      const {
        data: {
          session
        }
      } = await window.mwvSupabase.auth.getSession();


      if (session) {

        const isAdmin =
          await verifyAdmin(session.user.id);

        if (isAdmin) {

          window.location.href =
            "dashboard.html";

          return;

        }

        await window.mwvSupabase.auth.signOut();

      }


      // ==========================================
      // LOGIN
      // ==========================================

      loginForm.addEventListener(
        "submit",
        async (event) => {

          event.preventDefault();


          const email =
            emailInput.value.trim();

          const password =
            passwordInput.value;


          if (!email || !password) {

            showStatus(
              "error",
              "Please enter your email address and password."
            );

            return;
          }


          setLoading(true);

          showStatus(
            "loading",
            "Signing in securely..."
          );


          try {

            // ------------------------------------
            // SUPABASE AUTHENTICATION
            // ------------------------------------

            const {
              data,
              error
            } =
              await window.mwvSupabase.auth
                .signInWithPassword({
                  email,
                  password
                });


            if (error) {

              throw error;

            }


            if (!data.user) {

              throw new Error(
                "Authentication did not return a user."
              );

            }


            // ------------------------------------
            // VERIFY ADMIN
            // ------------------------------------

            const isAdmin =
              await verifyAdmin(data.user.id);


            if (!isAdmin) {

              await window.mwvSupabase.auth.signOut();

              throw new Error(
                "This account is not authorized to access the admin panel."
              );

            }


            // ------------------------------------
            // SUCCESS
            // ------------------------------------

            showStatus(
              "success",
              "Login successful. Opening Admin Panel..."
            );


            window.location.href =
              "dashboard.html";


          } catch (error) {

            console.error(
              "MoneyWithVikas admin login error:",
              error
            );


            showStatus(
              "error",
              getLoginErrorMessage(error)
            );


            setLoading(false);

          }

        }
      );


      // ==========================================
      // VERIFY ADMIN
      // ==========================================

      async function verifyAdmin(userId) {

        const {
          data,
          error
        } =
          await window.mwvSupabase
            .from("admin_users")
            .select("user_id")
            .eq("user_id", userId)
            .maybeSingle();


        if (error) {

          console.error(
            "Admin verification error:",
            error
          );

          return false;

        }


        return !!data;

      }


      // ==========================================
      // LOADING STATE
      // ==========================================

      function setLoading(isLoading) {

        loginButton.disabled =
          isLoading;

        if (isLoading) {

          loginButton.textContent =
            "Signing In…";

        } else {

          loginButton.textContent =
            "Sign In →";

        }

      }


      // ==========================================
      // STATUS MESSAGE
      // ==========================================

      function showStatus(type, message) {

        loginStatus.className =
          `login-status ${type}`;

        loginStatus.textContent =
          message;

      }


      // ==========================================
      // FRIENDLY AUTH ERRORS
      // ==========================================

      function getLoginErrorMessage(error) {

        const message =
          error?.message || "";


        if (
          message.toLowerCase().includes(
            "invalid login credentials"
          )
        ) {

          return "Invalid email or password.";

        }


        if (
          message.toLowerCase().includes(
            "email not confirmed"
          )
        ) {

          return "Your admin email has not been confirmed yet.";

        }


        if (
          message.toLowerCase().includes(
            "too many requests"
          )
        ) {

          return "Too many login attempts. Please wait a moment and try again.";

        }


        return (
          message ||
          "Unable to sign in. Please try again."
        );

      }

    });

  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js"></script>

</body>

</html>
