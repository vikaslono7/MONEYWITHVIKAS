<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Login — MoneyWithVikas</title>

  <style>
    :root {
      --bg: #07090b;
      --panel: #101419;
      --line: #29313a;
      --text: #f5f5f5;
      --muted: #9aa3ad;
      --yellow: #ffc400;
      --red: #ff2028;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top right, rgba(255, 196, 0, 0.08), transparent 35%),
        var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .login-page {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 430px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 35px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }

    .logo {
      font-size: 25px;
      font-weight: 900;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }

    .logo span {
      color: var(--yellow);
    }

    .tagline {
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 2px;
      margin-bottom: 35px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .intro {
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 25px;
    }

    label {
      display: block;
      color: #cbd0d6;
      font-size: 13px;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 18px;
      background: #080b0e;
      color: white;
      border: 1px solid var(--line);
      border-radius: 8px;
      outline: none;
    }

    input:focus {
      border-color: var(--yellow);
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: var(--yellow);
      color: #050505;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .login-btn:hover {
      opacity: 0.9;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: var(--muted);
      font-size: 13px;
      text-decoration: none;
    }

    .back:hover {
      color: white;
    }

    .notice {
      margin-top: 25px;
      padding: 12px;
      border: 1px solid #493f16;
      background: rgba(255, 196, 0, 0.05);
      color: #aaa;
      border-radius: 8px;
      font-size: 11px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="login-page">

    <form class="login-box" id="adminLogin">

      <div class="logo">
        MONEY<span>WITH</span>VIKAS
      </div>

      <div class="tagline">
        ADMIN CONTROL PANEL
      </div>

      <h1>Admin Login</h1>

      <p class="intro">
        Secure access to your MoneyWithVikas requests,
        bookings and website settings.
      </p>

      <label for="email">
        Email Address
      </label>

      <input
        id="email"
        type="email"
        placeholder="admin@moneywithvikas.com"
        required
      >

      <label for="password">
        Password
      </label>

      <input
        id="password"
        type="password"
        placeholder="Enter password"
        required
      >

      <button class="login-btn" type="submit">
        Sign In →
      </button>

      <a class="back" href="../index.html">
        ← Back to MoneyWithVikas
      </a>

      <div class="notice">
        Backend authentication will be connected using
        Supabase Auth. Do not treat this frontend login
        screen as a security layer yet.
      </div>

    </form>

  </div>

  <script>
    document
      .getElementById("adminLogin")
      .addEventListener("submit", function (event) {

        event.preventDefault();

        alert(
          "Admin authentication will be connected to Supabase in the backend phase."
        );

      });
  </script>

</body>
</html>
