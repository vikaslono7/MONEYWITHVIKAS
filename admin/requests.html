<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Requests — MoneyWithVikas Admin</title>

  <style>

    :root {
      --bg: #07090b;
      --sidebar: #050607;
      --panel: #101419;
      --line: #29313a;
      --text: #f5f5f5;
      --muted: #9aa3ad;
      --yellow: #ffc400;
      --red: #ff2028;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    .layout {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 235px;
      position: fixed;
      inset: 0 auto 0 0;
      background: var(--sidebar);
      border-right: 1px solid var(--line);
      padding: 25px 15px;
    }

    .logo {
      font-size: 20px;
      font-weight: 900;
    }

    .logo span {
      color: var(--yellow);
    }

    .admin-label {
      font-size: 9px;
      letter-spacing: 1.5px;
      color: var(--muted);
      margin-top: 5px;
      margin-bottom: 30px;
    }

    .nav a {
      display: block;
      padding: 13px;
      margin: 5px 0;
      border-radius: 8px;
      color: #cbd0d6;
      text-decoration: none;
    }

    .nav a:hover,
    .nav a.active {
      background: #171c22;
      color: white;
    }

    .nav a.active {
      border-left: 3px solid var(--yellow);
    }

    .website-link {
      position: absolute;
      left: 15px;
      right: 15px;
      bottom: 20px;
      padding: 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      text-align: center;
      text-decoration: none;
      color: white;
    }

    .main {
      margin-left: 235px;
      width: calc(100% - 235px);
      padding: 30px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
    }

    .muted {
      color: var(--muted);
    }

    .btn {
      border: 0;
      border-radius: 8px;
      padding: 11px 16px;
      background: var(--yellow);
      color: #050505;
      font-weight: 800;
      cursor: pointer;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .toolbar input,
    .toolbar select {
      background: var(--panel);
      color: white;
      border: 1px solid var(--line);
      padding: 11px 13px;
      border-radius: 8px;
    }

    .toolbar input {
      min-width: 260px;
    }

    .table-container {
      overflow-x: auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
    }

    table {
      width: 100%;
      min-width: 900px;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 14px;
      text-align: left;
      border-bottom: 1px solid var(--line);
    }

    th {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
    }

    td {
      font-size: 13px;
    }

    .empty {
      text-align: center;
      padding: 50px;
      color: var(--muted);
    }

    @media(max-width:700px) {

      .sidebar {
        position: static;
        width: 100%;
      }

      .layout {
        display: block;
      }

      .main {
        margin-left: 0;
        width: 100%;
        padding: 20px;
      }

    }

  </style>

</head>

<body>

<div class="layout">

  <aside class="sidebar">

    <div class="logo">
      MONEY<span>WITH</span>VIKAS
    </div>

    <div class="admin-label">
      ADMIN CONTROL PANEL
    </div>

    <nav class="nav">

      <a href="dashboard.html">
        📊 Dashboard
      </a>

      <a
        href="requests.html"
        class="active"
      >
        📩 Requests
      </a>

      <a href="bookings.html">
        📅 Bookings
      </a>

      <a href="settings.html">
        ⚙️ Settings
      </a>

    </nav>

    <a
      class="website-link"
      href="../index.html"
    >
      ← View Website
    </a>

  </aside>


  <main class="main">

    <div class="topbar">

      <div>

        <h1>
          Requests
        </h1>

        <p class="muted">
          Manage contact and connection requests
        </p>

      </div>

      <button
        class="btn"
        type="button"
        onclick="exportRequests()"
      >
        Export CSV
      </button>

    </div>


    <div class="toolbar">

      <input
        id="search"
        type="search"
        placeholder="Search name, phone or email"
      >

      <select id="purpose">

        <option value="">
          All Purposes
        </option>

        <option>
          Financial Solution
        </option>

        <option>
          Work with Vikas
        </option>

        <option>
          Business Opportunity
        </option>

        <option>
          Collaboration
        </option>

        <option>
          Join the Network
        </option>

        <option>
          Meet Vikas
        </option>

      </select>


      <select id="status">

        <option value="">
          All Statuses
        </option>

        <option>
          New
        </option>

        <option>
          Pending
        </option>

        <option>
          Closed
        </option>

      </select>

    </div>


    <div class="table-container">

      <table>

        <thead>

          <tr>

            <th>Name</th>
            <th>Phone</th>
            <th>Email</th>
            <th>Purpose</th>
            <th>Profession</th>
            <th>Location</th>
            <th>Status</th>
            <th>Action</th>

          </tr>

        </thead>

        <tbody id="requestTable">

          <tr>

            <td
              colspan="8"
              class="empty"
            >

              No requests available yet.

              <br><br>

              <small>
                Supabase will populate this table
                after backend integration.
              </small>

            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </main>

</div>


<script>

  function exportRequests() {

    alert(
      "CSV export will be connected to the Supabase request database."
    );

  }

</script>

</body>

</html>
